[tool.pytest.ini_options]
pythonpath = ["src", "src/transcription-api"]
testpaths = ["src/transcription-api/tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The API adds src/ to the import path before importing the data package.
"src/transcription-api/app/main.py" = ["E402"]
